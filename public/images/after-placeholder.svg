<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#0f172a" />
  
  <!-- Subtle warm glow -->
  <circle cx="400" cy="240" r="220" fill="#d97706" opacity="0.15" filter="blur(60px)"/>
  
  <!-- Architectural room lines -->
  <path d="M100 480L250 380H550L700 480H100Z" fill="#1e293b" opacity="0.8"/>
  <path d="M250 160V380H550V160H250Z" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <line x1="250" y1="160" x2="100" y2="100" stroke="#334155" stroke-width="1.5"/>
  <line x1="550" y1="160" x2="700" y2="100" stroke="#334155" stroke-width="1.5"/>
  <line x1="250" y1="380" x2="100" y2="480" stroke="#334155" stroke-width="1.5"/>
  <line x1="550" y1="380" x2="700" y2="480" stroke="#334155" stroke-width="1.5"/>

  <!-- Warm timber wall panelling & fluted wood feature -->
  <rect x="260" y="170" width="130" height="200" fill="#292524" rx="4"/>
  <line x1="275" y1="170" x2="275" y2="370" stroke="#78350f" stroke-width="1" opacity="0.6"/>
  <line x1="295" y1="170" x2="295" y2="370" stroke="#78350f" stroke-width="1" opacity="0.6"/>
  <line x1="315" y1="170" x2="315" y2="370" stroke="#78350f" stroke-width="1" opacity="0.6"/>
  <line x1="335" y1="170" x2="335" y2="370" stroke="#78350f" stroke-width="1" opacity="0.6"/>
  <line x1="355" y1="170" x2="355" y2="370" stroke="#78350f" stroke-width="1" opacity="0.6"/>
  <line x1="375" y1="170" x2="375" y2="370" stroke="#78350f" stroke-width="1" opacity="0.6"/>

  <!-- Large architectural picture window with soft evening light -->
  <rect x="410" y="170" width="130" height="150" fill="#1e3a5f" opacity="0.6" rx="4" stroke="#475569"/>
  <line x1="475" y1="170" x2="475" y2="320" stroke="#334155" stroke-width="1.5"/>

  <!-- Designer pendant light -->
  <line x1="400" y1="60" x2="400" y2="150" stroke="#d97706" stroke-width="2"/>
  <ellipse cx="400" cy="155" rx="28" ry="10" fill="#b45309"/>
  <circle cx="400" cy="162" r="8" fill="#fef08a" opacity="0.9"/>

  <!-- Contemporary bespoke sofa & coffee table -->
  <rect x="290" y="330" width="220" height="45" rx="8" fill="#475569"/>
  <rect x="300" y="320" width="200" height="20" rx="6" fill="#334155"/>
  <ellipse cx="400" cy="405" rx="60" ry="16" fill="#78350f" opacity="0.8"/>
  <ellipse cx="400" cy="403" rx="58" ry="14" fill="#b45309"/>

  <!-- Indoor plant & architectural vase -->
  <path d="M220 380L230 420H210L220 380Z" fill="#b45309"/>
  <circle cx="220" cy="365" r="14" fill="#15803d" opacity="0.8"/>

  <!-- Designer wool rug texture -->
  <ellipse cx="400" cy="445" rx="230" ry="38" fill="#334155" opacity="0.5"/>

  <!-- Badge label -->
  <rect x="40" y="40" width="185" height="36" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
  <text x="132" y="63" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">AFTER TRANSFORMATION</text>
  
  <text x="400" y="525" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Cohesive, Tailored Living Sanctuary</text>
  <text x="400" y="550" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Bespoke joinery, balanced layered lighting, natural materials &amp; acoustic comfort</text>
</svg>
