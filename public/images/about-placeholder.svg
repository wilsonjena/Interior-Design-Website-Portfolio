<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.25" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#aboutGrad)" rx="16" />
  <rect width="800" height="600" fill="url(#warmLight)" rx="16" />

  <!-- Studio Meeting Layout Silhouette -->
  <g stroke="rgba(255,255,255,0.12)" stroke-width="2">
    <!-- Window Frame -->
    <rect x="80" y="60" width="640" height="420" rx="8" />
    <line x1="400" y1="60" x2="400" y2="480" />
    <line x1="80" y1="270" x2="720" y2="270" />
    
    <!-- Table Surface -->
    <path d="M 120 440 L 680 440 L 620 540 L 180 540 Z" fill="rgba(255,255,255,0.06)" />
    
    <!-- Blueprint on Table -->
    <rect x="280" y="460" width="240" height="60" rx="4" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.4)" />
    <line x1="310" y1="480" x2="490" y2="480" stroke="rgba(59, 130, 246, 0.3)" />
    <line x1="310" y1="500" x2="440" y2="500" stroke="rgba(59, 130, 246, 0.3)" />
  </g>

  <!-- Team collaboration abstract markers -->
  <circle cx="260" cy="380" r="32" fill="rgba(217, 119, 6, 0.2)" stroke="#d97706" stroke-width="2" />
  <circle cx="540" cy="380" r="32" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="2" />

  <g transform="translate(400, 260)">
    <rect x="-160" y="-20" width="320" height="40" rx="20" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="0" y="6" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">ABOUT & TEAM VISUAL SLOT</text>
  </g>
  <text x="400" y="570" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="12">Replace in config.images.aboutImage</text>
</svg>
